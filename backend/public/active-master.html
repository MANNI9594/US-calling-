<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>US Calling Master Manager — Active Master</title>
<link rel="stylesheet" href="/styles.css" />
<style>
  .detail-panel { display: none; }
  .detail-panel dl { display: grid; grid-template-columns: 210px 1fr; gap: 6px 14px; font-size: 0.85rem; margin: 0; }
  .detail-panel dt { font-weight: 600; color: var(--text-600); }
  .detail-panel dd { margin: 0; }
  .controls-row { display: flex; gap: 10px; align-items: center; margin: 14px 0; flex-wrap: wrap; }
  .selection-count { font-size: 0.82rem; color: var(--text-600); font-weight: 600; }
  .vessel-link { color: var(--blue-700); cursor: pointer; font-weight: 600; text-decoration: none; }
  .vessel-link:hover { text-decoration: underline; }
</style>
</head>
<body>
  <nav class="topbar">
    <span class="brand">US Calling <span>Master</span></span>
    <a href="/active-master.html" class="active">Active Master</a>
    <a href="/import.html">Import Master Workbook</a>
    <a href="/us-calling-upload.html">Update from US Calling List</a>
    <a href="/evidence-review.html">Evidence Review</a>
    <a href="/manage-team.html">Team</a>
    <a href="/logout.html">Logout</a>
  </nav>

  <div class="page">
    <div class="page-header">
      <div>
        <h1>Active Master</h1>
        <p class="hint">Sorted by ETA (earliest first). Search covers vessel name and IMO number.</p>
      </div>
      <a href="/api/export/master-xlsx" class="btn btn-accent">⬇ Download Updated Master XLSX</a>
    </div>

    <div class="chip-row" id="tabs"></div>

    <div class="controls-row">
      <input type="text" id="searchInput" placeholder="Search vessel name or IMO..." style="width: 260px;" />
      <button id="selectAllBtn" class="btn btn-secondary">Select All</button>
      <button id="clearSelectionBtn" class="btn btn-secondary">Clear Selection</button>
      <button id="actionBtn" class="btn btn-danger" disabled>Remove Selected</button>
      <span class="selection-count" id="selectionCount"></span>
    </div>

    <div id="message" class="alert"></div>

    <div class="table-wrap">
      <table class="data-table" id="masterTable"></table>
    </div>

    <div id="detailPanel" class="card detail-panel"></div>
  </div>

  <script>
    let activeTab = 'ACTIVE';
    let vessels = [];
    let selected = new Set();
    let searchTimer = null;

    fetch('/api/auth/me', { credentials: 'include' }).then((res) => {
      if (!res.ok) window.location.href = '/login.html';
    });

    function renderTabs() {
      const tabsDiv = document.getElementById('tabs');
      tabsDiv.innerHTML = `
        <div class="chip ${activeTab === 'ACTIVE' ? 'active' : ''}" data-key="ACTIVE"><span class="dot blue"></span>Active Master</div>
        <div class="chip ${activeTab === 'ARCHIVED' ? 'active' : ''}" data-key="ARCHIVED"><span class="dot amber"></span>Archived</div>
      `;
      tabsDiv.querySelectorAll('.chip').forEach((el) => {
        el.addEventListener('click', () => {
          activeTab = el.dataset.key;
          selected.clear();
          renderTabs();
          updateActionButton();
          loadVessels();
        });
      });

      const actionBtn = document.getElementById('actionBtn');
      actionBtn.textContent = activeTab === 'ACTIVE' ? 'Remove Selected' : 'Restore Selected';
      actionBtn.className = 'btn ' + (activeTab === 'ACTIVE' ? 'btn-danger' : 'btn-accent');
    }

    function updateActionButton() {
      const btn = document.getElementById('actionBtn');
      btn.disabled = selected.size === 0;
      document.getElementById('selectionCount').textContent = selected.size > 0 ? `${selected.size} selected` : '';
    }

    async function loadVessels() {
      const table = document.getElementById('masterTable');
      table.innerHTML = '<tr><td class="empty-state">Loading…</td></tr>';
      const search = document.getElementById('searchInput').value.trim();

      const params = new URLSearchParams({ status: activeTab, sortBy: 'eta', sortDir: 'asc' });
      if (search) params.set('search', search);

      const res = await fetch(`/api/vessels?${params.toString()}`, { credentials: 'include' });
      const data = await res.json();
      vessels = data.vessels || [];
      renderTable();
    }

    function hasPastEtd(v) {
      return (v.dataQualityIssues || []).some((i) => i.issueType === 'PAST_ETD');
    }
    function openDqCount(v) {
      return (v.dataQualityIssues || []).length;
    }

    function renderTable() {
      const table = document.getElementById('masterTable');
      if (vessels.length === 0) {
        table.innerHTML = '<tr><td class="empty-state">No vessels found.</td></tr>';
        return;
      }

      const rows = vessels.map((v) => {
        const cr = (v.callingRecords || [])[0] || {};
        const checked = selected.has(v.id) ? 'checked' : '';
        const past = hasPastEtd(v);
        return `
          <tr class="${past ? 'flagged' : ''}">
            <td><input type="checkbox" class="rowCheck" data-id="${v.id}" ${checked} /></td>
            <td><span class="vessel-link" data-id="${v.id}">${v.vesselName}</span> ${past ? '<span class="badge badge-red">Past ETD</span>' : ''} ${openDqCount(v) > 0 && !past ? `<span class="badge badge-amber">${openDqCount(v)} flag(s)</span>` : ''}</td>
            <td>${v.imoNumber ?? '—'}</td>
            <td>${v.flag ?? '—'}</td>
            <td>${v.vesselType ?? '—'}</td>
            <td>${cr.arrivalPort ?? '—'}</td>
            <td>${cr.etaRaw ?? '—'}</td>
            <td>${cr.etdRaw ?? '—'}</td>
            <td><span class="badge badge-outline">${(v.evidence || []).length}</span></td>
          </tr>
        `;
      }).join('');

      table.innerHTML = `
        <thead>
          <tr>
            <th style="width:32px;"></th>
            <th>Vessel</th>
            <th>IMO</th>
            <th>Flag</th>
            <th>Type</th>
            <th>Port</th>
            <th>ETA</th>
            <th>ETD</th>
            <th>Evidence</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      `;

      table.querySelectorAll('.rowCheck').forEach((cb) => {
        cb.addEventListener('change', () => {
          if (cb.checked) selected.add(cb.dataset.id);
          else selected.delete(cb.dataset.id);
          updateActionButton();
        });
      });
      table.querySelectorAll('.vessel-link').forEach((el) => {
        el.addEventListener('click', () => showDetail(el.dataset.id));
      });
    }

    async function showDetail(vesselId) {
      const panel = document.getElementById('detailPanel');
      panel.style.display = 'block';
      panel.innerHTML = 'Loading…';

      const res = await fetch(`/api/vessels/${vesselId}`, { credentials: 'include' });
      const data = await res.json();
      const v = data.vessel;
      const cr = (v.callingRecords || []).find((r) => r.isCurrent) || {};

      panel.innerHTML = `
        <h3>${v.vesselName} <button class="btn btn-secondary" id="closeDetailBtn" style="float:right;">Close</button></h3>
        <dl>
          <dt>IMO Number</dt><dd>${v.imoNumber ?? '—'}${v.imoNumberPlausible === false ? ' <span class="badge badge-amber">implausible</span>' : ''}</dd>
          <dt>Flag</dt><dd>${v.flag ?? '—'}</dd>
          <dt>Vessel Type</dt><dd>${v.vesselType ?? '—'}</dd>
          <dt>Summer Deadweight/TEU</dt><dd>${v.summerDeadweightOrTeu ?? '—'}</dd>
          <dt>Registered Owner (CoR)</dt><dd>${v.registeredOwnerPerCor ?? '—'}</dd>
          <dt>Registered Owner (CSR)</dt><dd>${v.registeredOwnerPerCsr ?? '—'}</dd>
          <dt>Operator (COFR)</dt><dd>${v.operatorNameInCofr ?? '—'}</dd>
          <dt>Bridge Letter</dt><dd>${v.bridgeLetter ?? '—'}</dd>
          <dt>Built Location</dt><dd>${v.builtLocation ?? '—'}</dd>
          <dt>Service Fees</dt><dd>${v.serviceFeesApplicable ?? '—'}</dd>
          <dt>Current Port / ETA / ETD</dt><dd>${cr.arrivalPort ?? '—'} / ${cr.etaRaw ?? '—'} / ${cr.etdRaw ?? '—'}</dd>
          <dt>Voyage / Transaction / Send To</dt><dd>${cr.voyageType ?? '—'} / ${cr.transactionType ?? '—'} / ${cr.sendTo ?? '—'}</dd>
          <dt>Evidence records</dt><dd>${(v.evidence || []).length} (<a href="/evidence-review.html" target="_blank">review</a>)</dd>
          <dt>Open data quality issues</dt><dd>${(v.dataQualityIssues || []).map((i) => `${i.issueType}: ${i.message}`).join('<br>') || 'None'}</dd>
        </dl>
      `;
      document.getElementById('closeDetailBtn').addEventListener('click', () => { panel.style.display = 'none'; });
    }

    document.getElementById('searchInput').addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(loadVessels, 300);
    });

    document.getElementById('selectAllBtn').addEventListener('click', () => {
      vessels.forEach((v) => selected.add(v.id));
      renderTable();
      updateActionButton();
    });
    document.getElementById('clearSelectionBtn').addEventListener('click', () => {
      selected.clear();
      renderTable();
      updateActionButton();
    });

    document.getElementById('actionBtn').addEventListener('click', async () => {
      if (selected.size === 0) return;
      const verb = activeTab === 'ACTIVE' ? 'remove and archive' : 'restore';
      if (!confirm(`${verb.charAt(0).toUpperCase() + verb.slice(1)} ${selected.size} vessel(s)? ${activeTab === 'ACTIVE' ? 'Their information will be archived and can be restored later.' : ''}`)) {
        return;
      }

      const endpoint = activeTab === 'ACTIVE' ? '/api/vessels/archive' : '/api/vessels/restore';
      const message = document.getElementById('message');
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ vesselIds: Array.from(selected) }),
        });
        const data = await res.json();
        if (!res.ok) {
          message.className = 'alert alert-error show';
          message.textContent = data.error || 'Action failed.';
          return;
        }
        message.className = 'alert alert-success show';
        const count = data.archived ?? data.restored ?? 0;
        message.textContent = `Done: ${count} vessel(s) ${activeTab === 'ACTIVE' ? 'removed and archived' : 'restored'}${data.skipped ? `, ${data.skipped} skipped (already in that state)` : ''}.`;
        selected.clear();
        updateActionButton();
        loadVessels();
      } catch {
        message.className = 'alert alert-error show';
        message.textContent = 'Could not reach the server.';
      }
    });

    renderTabs();
    loadVessels();
  </script>
</body>
</html>
