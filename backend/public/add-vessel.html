<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>US Calling Master Manager — Add Vessel</title>
<link rel="stylesheet" href="/styles.css" />
<style>
  .pending-op { background: var(--blue-50); color: #1e40af; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.85rem; margin-top: 14px; }
</style>
</head>
<body>
  <nav class="topbar">
    <span class="brand">US Calling <span>Master</span></span>
    <a href="/active-master.html">Active Master</a>
    <a href="/import.html">Import Master Workbook</a>
    <a href="/us-calling-upload.html">Update from US Calling List</a>
    <a href="/evidence-review.html">Evidence Review</a>
    <a href="/manage-team.html">Team</a>
    <a href="/logout.html">Logout</a>
  </nav>

  <div class="page narrow">
    <div class="page-header">
      <div>
        <h1>Add Vessel to Database</h1>
        <p class="hint">This vessel didn't match anything in the database. Fill in what you know — nothing here is invented automatically.</p>
      </div>
    </div>

    <div class="pending-op" id="pendingOpInfo" style="display:none;"></div>

    <form id="addForm">
      <label for="vesselName">Vessel Name *</label>
      <input type="text" id="vesselName" required />

      <fieldset>
        <legend>Permanent Profile</legend>

        <label for="imoNumber">IMO Number</label>
        <input type="text" id="imoNumber" />

        <label for="flag">Flag</label>
        <input type="text" id="flag" />

        <label for="vesselType">Vessel Type</label>
        <input type="text" id="vesselType" placeholder="Bulk / Container / Tanker / LNG / Car Carrier" />

        <label for="summerDeadweightOrTeu">Summer Deadweight / TEU</label>
        <input type="text" id="summerDeadweightOrTeu" />

        <label for="registeredOwnerPerCor">Registered Owner (per Certificate of Registry)</label>
        <input type="text" id="registeredOwnerPerCor" />

        <label for="registeredOwnerPerCsr">Registered Owner (per CSR)</label>
        <input type="text" id="registeredOwnerPerCsr" />

        <label for="operatorNameInCofr">Operator's Name in COFR</label>
        <input type="text" id="operatorNameInCofr" />

        <label for="bridgeLetter">Bridge Letter</label>
        <input type="text" id="bridgeLetter" />

        <label for="builtLocation">Built Location</label>
        <input type="text" id="builtLocation" />

        <label for="serviceFeesApplicable">Service Fees Applicable</label>
        <select id="serviceFeesApplicable">
          <option value="UNKNOWN">Unknown</option>
          <option value="YES">Yes</option>
          <option value="NO">No</option>
          <option value="NA">N/A</option>
        </select>
      </fieldset>

      <div style="margin-top: 16px;">
        <button type="submit" id="submitBtn" class="btn btn-accent">Create Vessel</button>
      </div>
    </form>

    <div id="result" class="alert"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const pendingOp = {
      vesselName: params.get('vesselName') || '',
      arrivalPort: params.get('arrivalPort') || '',
      etaRaw: params.get('etaRaw') || '',
      etdRaw: params.get('etdRaw') || '',
      voyageType: params.get('voyageType') || '',
      transactionType: params.get('transactionType') || '',
      sendTo: params.get('sendTo') || '',
    };

    fetch('/api/auth/me', { credentials: 'include' }).then((res) => {
      if (!res.ok) window.location.href = '/login.html';
    });

    if (pendingOp.vesselName) {
      document.getElementById('vesselName').value = pendingOp.vesselName;
    }
    if (pendingOp.etaRaw || pendingOp.etdRaw || pendingOp.arrivalPort) {
      const info = document.getElementById('pendingOpInfo');
      info.style.display = 'block';
      info.innerHTML = `<strong>Pending update from this row will be applied on creation:</strong><br>
        Port: ${pendingOp.arrivalPort || '—'} | ETA: ${pendingOp.etaRaw || '—'} | ETD: ${pendingOp.etdRaw || '—'}`;
    }

    const form = document.getElementById('addForm');
    const resultBox = document.getElementById('result');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating...';
      resultBox.className = 'alert';

      const body = {
        vesselName: document.getElementById('vesselName').value,
        imoNumber: document.getElementById('imoNumber').value || undefined,
        flag: document.getElementById('flag').value || undefined,
        vesselType: document.getElementById('vesselType').value || undefined,
        summerDeadweightOrTeu: document.getElementById('summerDeadweightOrTeu').value || undefined,
        registeredOwnerPerCor: document.getElementById('registeredOwnerPerCor').value || undefined,
        registeredOwnerPerCsr: document.getElementById('registeredOwnerPerCsr').value || undefined,
        operatorNameInCofr: document.getElementById('operatorNameInCofr').value || undefined,
        bridgeLetter: document.getElementById('bridgeLetter').value || undefined,
        builtLocation: document.getElementById('builtLocation').value || undefined,
        serviceFeesApplicable: document.getElementById('serviceFeesApplicable').value,
        arrivalPort: pendingOp.arrivalPort || undefined,
        etaRaw: pendingOp.etaRaw || undefined,
        etdRaw: pendingOp.etdRaw || undefined,
        voyageType: pendingOp.voyageType || undefined,
        transactionType: pendingOp.transactionType || undefined,
        sendTo: pendingOp.sendTo || undefined,
      };

      try {
        const res = await fetch('/api/vessels', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(body),
        });
        const data = await res.json();

        if (res.ok) {
          resultBox.className = 'alert alert-success show';
          resultBox.textContent = `${data.vessel.vesselName} added to the Active Master${data.dataQualityIssuesRaised > 0 ? ` (${data.dataQualityIssuesRaised} data quality issue(s) flagged — check its profile)` : ''}.`;
          form.style.display = 'none';
        } else {
          resultBox.className = 'alert alert-error show';
          resultBox.textContent = data.error || 'Could not create vessel.';
        }
      } catch {
        resultBox.className = 'alert alert-error show';
        resultBox.textContent = 'Could not reach the server.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Vessel';
      }
    });
  </script>
</body>
</html>
