<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>US Calling Master Manager — Evidence Review</title>
<link rel="stylesheet" href="/styles.css" />
<style>
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-top: 16px; }
  .ev-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); transition: box-shadow 0.15s; }
  .ev-card:hover { box-shadow: var(--shadow-md); }
  .ev-card img { width: 100%; height: 120px; object-fit: contain; background: var(--bg-subtle); cursor: zoom-in; display: block; }
  .ev-card-body { padding: 12px; }
  .vessel-name { font-weight: 700; margin: 6px 0 4px; font-size: 0.9rem; }
  .vessel-name.none { color: var(--text-400); font-style: italic; font-weight: 400; }
  .confidence { font-size: 0.75rem; color: var(--text-600); margin-bottom: 8px; }
  .ev-actions { display: flex; gap: 4px; flex-wrap: wrap; }
  .ev-actions .btn { flex: 1; min-width: 60px; padding: 6px 4px; font-size: 0.72rem; }
  #lightbox { display: none; position: fixed; inset: 0; background: rgba(15,23,41,0.9); z-index: 100; align-items: center; justify-content: center; cursor: zoom-out; }
  #lightbox img { max-width: 90%; max-height: 90%; border-radius: var(--radius); }
  .no-evidence-section { margin-top: 32px; }
  .no-evidence-section ul { columns: 3; font-size: 0.85rem; color: var(--text-600); }
  .ocr-controls { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  #ocrStatus { font-size: 0.82rem; color: var(--text-600); }
</style>
</head>
<body>
  <nav class="topbar">
    <span class="brand">US Calling <span>Master</span></span>
    <a href="/active-master.html">Active Master</a>
    <a href="/import.html">Import Master Workbook</a>
    <a href="/us-calling-upload.html">Update from US Calling List</a>
    <a href="/evidence-review.html" class="active">Evidence Review</a>
    <a href="/manage-team.html">Team</a>
    <a href="/logout.html">Logout</a>
  </nav>

  <div class="page">
    <div class="page-header">
      <div>
        <h1>Evidence Review</h1>
        <p class="hint">Every screenshot from the Master workbook, sorted by review status. Nothing here was auto-confirmed.</p>
      </div>
    </div>

    <div class="chip-row" id="tabs"></div>

    <div class="ocr-controls">
      <button id="ocrRepairBtn" class="btn btn-accent">Run OCR Matching on Unassigned Evidence</button>
      <span id="ocrStatus"></span>
    </div>

    <div class="grid" id="grid"></div>

    <div class="card no-evidence-section">
      <h3>Vessels with no evidence at all</h3>
      <div id="noEvidenceList">Loading…</div>
    </div>
  </div>

  <div id="lightbox"><img id="lightboxImg" src="" /></div>

  <script>
    const TABS = [
      { key: 'NEEDS_REVIEW', label: 'Needs Review', dot: 'amber' },
      { key: 'UNASSIGNED', label: 'Unassigned', dot: 'blue' },
      { key: 'CONFIRMED', label: 'Confirmed', dot: 'green' },
      { key: 'REJECTED_DUPLICATE', label: 'Rejected (Duplicate)', dot: 'red' },
      { key: 'REJECTED_IRRELEVANT', label: 'Rejected (Irrelevant)', dot: 'red' },
    ];
    let activeTab = 'NEEDS_REVIEW';
    let counts = {};

    fetch('/api/auth/me', { credentials: 'include' }).then((res) => {
      if (!res.ok) window.location.href = '/login.html';
    });

    async function fetchCounts() {
      for (const tab of TABS) {
        const res = await fetch(`/api/evidence?status=${tab.key}`, { credentials: 'include' });
        const data = await res.json();
        counts[tab.key] = data.count ?? 0;
      }
      renderTabs();
    }

    function renderTabs() {
      const tabsDiv = document.getElementById('tabs');
      tabsDiv.innerHTML = TABS.map(
        (t) => `<div class="chip ${t.key === activeTab ? 'active' : ''}" data-key="${t.key}"><span class="dot ${t.dot}"></span>${t.label} (${counts[t.key] ?? '…'})</div>`
      ).join('');
      tabsDiv.querySelectorAll('.chip').forEach((el) => {
        el.addEventListener('click', () => {
          activeTab = el.dataset.key;
          renderTabs();
          loadGrid();
        });
      });
    }

    async function loadGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '<div class="empty-state">Loading…</div>';
      const res = await fetch(`/api/evidence?status=${activeTab}`, { credentials: 'include' });
      const data = await res.json();

      if (!data.evidence || data.evidence.length === 0) {
        grid.innerHTML = '<div class="empty-state">Nothing here.</div>';
        return;
      }

      grid.innerHTML = data.evidence.map((ev) => renderCard(ev)).join('');
      wireCardActions();
    }

    function renderCard(ev) {
      const vesselLabel = ev.vessel
        ? `${ev.vessel.vesselName}${ev.vessel.imoNumber ? ' (IMO ' + ev.vessel.imoNumber + ')' : ''}`
        : null;

      let confidenceLine = '';
      if (ev.associationMethod === 'OCR_AUTO_MATCH' && ev.associationConfidence != null) {
        const pct = Math.round(parseFloat(ev.associationConfidence) * 100);
        confidenceLine = `<div class="confidence">OCR suggested — ${pct}% confidence</div>`;
      }

      let actions = '';
      if (activeTab === 'NEEDS_REVIEW') {
        actions = `
          <div class="ev-actions">
            <button class="btn btn-accent" data-action="confirm" data-id="${ev.id}">Confirm</button>
            <button class="btn btn-secondary" data-action="reassign" data-id="${ev.id}">Reassign</button>
            <button class="btn btn-secondary" data-action="reject-duplicate" data-id="${ev.id}">Duplicate</button>
            <button class="btn btn-secondary" data-action="reject-irrelevant" data-id="${ev.id}">Irrelevant</button>
          </div>`;
      } else if (activeTab === 'UNASSIGNED') {
        actions = `
          <div class="ev-actions">
            <button class="btn btn-accent" data-action="reassign" data-id="${ev.id}">Assign to vessel</button>
            <button class="btn btn-secondary" data-action="reject-duplicate" data-id="${ev.id}">Duplicate</button>
            <button class="btn btn-secondary" data-action="reject-irrelevant" data-id="${ev.id}">Irrelevant</button>
          </div>`;
      } else if (activeTab === 'CONFIRMED') {
        actions = `<div class="ev-actions"><button class="btn btn-secondary" data-action="reassign" data-id="${ev.id}">Reassign</button></div>`;
      }

      return `
        <div class="ev-card">
          <img src="/api/evidence/${ev.id}/image" loading="lazy" data-full="/api/evidence/${ev.id}/image" />
          <div class="ev-card-body">
            <div class="vessel-name ${vesselLabel ? '' : 'none'}">${vesselLabel || 'No vessel assigned'}</div>
            ${confidenceLine}
            ${actions}
          </div>
        </div>`;
    }

    function wireCardActions() {
      document.querySelectorAll('.ev-card img').forEach((img) => {
        img.addEventListener('click', () => {
          document.getElementById('lightboxImg').src = img.dataset.full;
          document.getElementById('lightbox').style.display = 'flex';
        });
      });
      document.getElementById('lightbox').addEventListener('click', () => {
        document.getElementById('lightbox').style.display = 'none';
      });

      document.querySelectorAll('[data-action="confirm"]').forEach((btn) => {
        btn.addEventListener('click', () => doAction(btn.dataset.id, 'confirm'));
      });
      document.querySelectorAll('[data-action="reject-duplicate"]').forEach((btn) => {
        btn.addEventListener('click', () => doAction(btn.dataset.id, 'reject', { reason: 'DUPLICATE' }));
      });
      document.querySelectorAll('[data-action="reject-irrelevant"]').forEach((btn) => {
        btn.addEventListener('click', () => doAction(btn.dataset.id, 'reject', { reason: 'IRRELEVANT' }));
      });
      document.querySelectorAll('[data-action="reassign"]').forEach((btn) => {
        btn.addEventListener('click', () => reassignFlow(btn.dataset.id));
      });
    }

    async function doAction(evidenceId, action, body) {
      const res = await fetch(`/api/evidence/${evidenceId}/${action}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: body ? JSON.stringify(body) : undefined,
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        alert(data.error || 'Action failed.');
        return;
      }
      await fetchCounts();
      loadGrid();
    }

    async function reassignFlow(evidenceId) {
      const query = prompt('Type part of the vessel name to search for:');
      if (!query) return;

      const res = await fetch(`/api/vessels?search=${encodeURIComponent(query)}`, { credentials: 'include' });
      const data = await res.json();

      if (!data.vessels || data.vessels.length === 0) {
        alert('No vessels matched that search.');
        return;
      }

      const listText = data.vessels.map((v, i) => `${i + 1}. ${v.vesselName}${v.imoNumber ? ' (IMO ' + v.imoNumber + ')' : ''}`).join('\n');
      const choice = prompt(`Matches:\n${listText}\n\nEnter the number of the vessel to assign this evidence to:`);
      const idx = parseInt(choice, 10) - 1;
      if (isNaN(idx) || !data.vessels[idx]) {
        alert('No valid selection made.');
        return;
      }

      await doAction(evidenceId, 'assign', { vesselId: data.vessels[idx].id });
    }

    async function loadVesselsWithNoEvidence() {
      const res = await fetch('/api/vessels', { credentials: 'include' });
      const data = await res.json();
      const div = document.getElementById('noEvidenceList');
      if (!data.vessels) {
        div.textContent = 'Could not load vessels.';
        return;
      }
      const noEvidence = data.vessels.filter((v) => !v.evidence || v.evidence.length === 0);
      if (noEvidence.length === 0) {
        div.textContent = 'Every vessel has at least one evidence record.';
        return;
      }
      div.innerHTML = `<ul>${noEvidence.map((v) => `<li>${v.vesselName}</li>`).join('')}</ul>`;
    }

    document.getElementById('ocrRepairBtn').addEventListener('click', async () => {
      const btn = document.getElementById('ocrRepairBtn');
      const status = document.getElementById('ocrStatus');
      btn.disabled = true;
      status.textContent = 'Running OCR on unassigned images — this can take a minute or two...';

      try {
        const res = await fetch('/api/evidence/ocr-repair', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({}),
        });
        const data = await res.json();

        if (!res.ok) {
          status.textContent = data.error || 'OCR repair failed.';
          return;
        }

        const s = data.summary;
        status.textContent = `Done: ${s.processed} processed, ${s.suggested} suggestions found, ${s.leftUnassigned} still unassigned, ${s.failed} failed.`;
        await fetchCounts();
        loadGrid();
      } catch {
        status.textContent = 'Could not reach the server.';
      } finally {
        btn.disabled = false;
      }
    });

    fetchCounts();
    loadGrid();
    loadVesselsWithNoEvidence();
  </script>
</body>
</html>
