<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>US Calling Master Manager — Log In</title>
<link rel="stylesheet" href="/styles.css" />
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .auth-card { width: 380px; }
  .auth-card h1 { font-size: 1.25rem; text-align: center; margin-bottom: 4px; }
  .auth-card .brand-line { text-align: center; color: var(--text-600); font-size: 0.85rem; margin-bottom: 18px; }
</style>
</head>
<body>
  <div class="card auth-card">
    <h1>US Calling <span style="color: var(--blue-600);">Master</span> Manager</h1>
    <p class="brand-line">Sign in to continue</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" style="width:100%;" />

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" style="width:100%;" />

      <div style="margin-top: 18px;">
        <button type="submit" id="submitBtn" class="btn btn-accent" style="width:100%; justify-content:center;">Log in</button>
      </div>
    </form>

    <div id="result" class="alert"></div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const resultBox = document.getElementById('result');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';
      resultBox.className = 'alert';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();

        if (res.ok) {
          window.location.href = '/active-master.html';
        } else {
          resultBox.className = 'alert alert-error show';
          resultBox.textContent = data.error || 'Login failed.';
        }
      } catch {
        resultBox.className = 'alert alert-error show';
        resultBox.textContent = 'Could not reach the server.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
