<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>US Calling Master Manager — Log In</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 420px; margin: 80px auto; padding: 0 20px; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  label { display: block; margin-top: 16px; font-weight: 600; font-size: 0.9rem; }
  input { width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
  button { margin-top: 24px; width: 100%; padding: 12px; background: #0f172a; color: white; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
  button:disabled { background: #94a3b8; cursor: not-allowed; }
  #result { margin-top: 20px; padding: 12px; border-radius: 6px; display: none; font-size: 0.9rem; }
  #result.error { background: #fee2e2; color: #991b1b; display: block; }
  a.next { display: block; margin-top: 16px; text-align: center; color: #0f172a; }
</style>
</head>
<body>
  <h1>US Calling Master Manager</h1>

  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="email" />

    <label for="password">Password</label>
    <input type="password" id="password" required autocomplete="current-password" />

    <button type="submit" id="submitBtn">Log in</button>
  </form>

  <div id="result"></div>

  <script>
    const form = document.getElementById('loginForm');
    const resultBox = document.getElementById('result');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';
      resultBox.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();

        if (res.ok) {
          window.location.href = '/active-master.html';
        } else {
          resultBox.className = 'error';
          resultBox.textContent = data.error || 'Login failed.';
        }
      } catch {
        resultBox.className = 'error';
        resultBox.textContent = 'Could not reach the server.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
