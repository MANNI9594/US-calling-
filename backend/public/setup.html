<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>US Calling Master Manager — First-Time Setup</title>
<link rel="stylesheet" href="/styles.css" />
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .auth-card { width: 420px; }
  .auth-card h1 { font-size: 1.25rem; margin-bottom: 4px; }
</style>
</head>
<body>
  <div class="card auth-card">
    <h1>US Calling <span style="color: var(--blue-600);">Master</span> Manager</h1>
    <p class="text-muted" style="font-size: 0.85rem;">
      One-time setup. This creates your first login. This page only works
      once — if an account already exists, use the regular login instead.
    </p>

    <form id="setupForm">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" style="width:100%;" />

      <label for="password">Password (min. 10 characters)</label>
      <input type="password" id="password" required minlength="10" autocomplete="new-password" style="width:100%;" />

      <div style="margin-top: 18px;">
        <button type="submit" id="submitBtn" class="btn btn-accent" style="width:100%; justify-content:center;">Create my account</button>
      </div>
    </form>

    <div id="result" class="alert"></div>
  </div>

  <script>
    const form = document.getElementById('setupForm');
    const resultBox = document.getElementById('result');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating...';
      resultBox.className = 'alert';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (res.ok) {
          resultBox.className = 'alert alert-success show';
          resultBox.textContent = `Account created for ${data.email}. Redirecting you to the VECS List...`;
          form.style.display = 'none';
          setTimeout(() => { window.location.href = '/active-master.html'; }, 1500);
        } else {
          resultBox.className = 'alert alert-error show';
          resultBox.textContent = data.error || 'Setup failed.';
          if (data.details) {
            resultBox.textContent += ' ' + JSON.stringify(data.details.fieldErrors || data.details);
          }
        }
      } catch {
        resultBox.className = 'alert alert-error show';
        resultBox.textContent = 'Could not reach the server. Check that the app has finished deploying.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create my account';
      }
    });
  </script>
</body>
</html>
